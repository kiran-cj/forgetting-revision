[project]
name = "forgetting-revision"
version = "0.1.0"
description = "Python Implementation of Variable Forgetting Revision"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Kiran CJ", email = "kirancj4000@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
check-postulates = "forgetting_revision.checker:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy",
    "pytest>=9.2.0",
    "ruff",
]

[tool.ruff.lint]
# __all__ in __init__.py is grouped by module on purpose, not sorted alphabetically.
ignore = ["RUF022"]

[tool.pytest.ini_options]
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = true
# this is to display the non-ASCII characters lol